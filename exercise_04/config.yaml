# ============================================================================
# Exercise 04: Hyperparameter Optimization — Base Configuration
# ============================================================================
# This config provides default values. Optuna will override learning_rate,
# dropout, and batch_size during the search. All other settings remain fixed.
# ============================================================================

# --- Experiment ---
experiment_name: "plantwild_optuna_plantcnn"
seed: 42

# --- Data ---
data:
  root_dir: "data/plantwild"
  image_size: 128
  batch_size: 32               # overridden by Optuna
  num_workers: 4
  augmentation: true

# --- Model ---
model:
  # Supported: "plantcnn", "resnet18", "resnet50", "vgg16", "alexnet"
  # Start with "plantcnn" as baseline, then switch to "resnet18" and compare.
  name: "plantcnn"                 # "plantcnn" is a simple CNN; "resnet18" is a deeper architecture
  pretrained: true             # ignored for plantcnn; applies when switching to resnet18, vgg16, etc.
  num_classes: 10              # adjust to match your dataset subset
  dropout: 0.5                 # overridden by Optuna (used by plantcnn/vgg16)

# --- Training ---
training:
  epochs: 10                   # fewer epochs per trial to keep search fast
  learning_rate: 0.001         # overridden by Optuna
  optimizer: "adamw"           # fixed — AdamW is a strong default for vision tasks
  weight_decay: 0.0001
  n_trials: 5                   # number of Optuna trials to run

# --- Checkpointing ---
checkpoint:
  save_dir: "outputs/checkpoints"
  save_best_only: true

# --- Logging ---
logging:
  log_dir: "outputs/logs"
  log_interval: 10

# --- Device ---
device: "cuda"
