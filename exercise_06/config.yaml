# ============================================================================
# Exercise 06: Semantic Segmentation — Configuration
# ============================================================================

experiment_name: "phenobench_segmentation"
seed: 42

# --- Data ---
data:
  root_dir: "data/phenobench_256"
  image_size: 256
  batch_size: 4
  num_workers: 4

# --- Model ---
# Supported: "unet", "deeplabv3_resnet50", "fcn_resnet50", "segformer_b0"
model:
  name: "unet"
  num_classes: 3               # background + crop + weed
  pretrained: true             # ignored for unet; applies to deeplabv3/fcn

# --- Training ---
training:
  epochs: 30
  learning_rate: 0.001
  optimizer: "adamw"
  weight_decay: 0.0001

# --- Checkpointing ---
checkpoint:
  save_dir: "outputs/checkpoints"
  save_best_only: true

# --- Logging ---
logging:
  log_dir: "outputs/logs"
  log_interval: 10

# --- Device ---
device: "cuda"
